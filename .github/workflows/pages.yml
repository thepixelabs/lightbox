#
# Publishes web/ to GitHub Pages. The site is static with no build step, so
# this uploads the directory as-is.

name: pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  # A published release changes what the download button points at, so the
  # site is redeployed with it.
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight run rather than
# queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Cheap guard against the most common way this page goes stale: a
      # licence claim in the HTML drifting away from the repository's LICENSE.
      - name: Check the licence claim still matches
        run: |
          set -euo pipefail
          if grep -qiE 'source[ -]available|polyform|noncommercial' web/index.html; then
            echo "web/index.html still describes a licence this project no longer uses" >&2
            exit 1
          fi
          grep -q 'Affero' web/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
