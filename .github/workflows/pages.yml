#
# Publishes web/ to GitHub Pages. The site is static with no build step, so
# this uploads the directory as-is.

name: pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  # A published release changes what the download button points at, so the
  # site is redeployed with it.
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight run rather than
# queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The same checks CI runs, rather than a weaker copy of one of them.
      # This job used to carry its own inline licence grep that demanded the
      # literal word "Affero", which failed the deploy the moment the page
      # started naming the licence by its SPDX identifier instead. Two guards
      # for one claim is one guard too many: the second only ever drifts.
      - name: Site structure and claims
        run: python3 tools/site-checks/check_site.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
