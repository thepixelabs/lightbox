#
# Nightly gates (E01 spec §5 T13/T28, §6, DoD §8.3): the 1000-iteration
# kill -9 fault-injection run at 0 corruptions / 0 lost commits, plus the
# perf scenario harness — lbx-perf (import-1k, page-query @100k, nav-swap),
# the scripted grid-scroll capture, and the criterion micro-benches.
# Perf regressions are REPORTED (job summary + tracked issue), never
# blocking (spec §8: "regression ⇒ tracked issue, non-blocking").

name: Nightly

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write # perf-regression tracking issues (T28)

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  fault-injection:
    name: kill -9 fault injection x1000 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Crash-safety is filesystem/OS-semantics dependent — run the long
        # leg on all three platforms, like the PR subset.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: fault injection (1000 iterations, release)
        env:
          LIGHTBOX_FAULT_ITERS: "1000"
        run: >
          cargo test -p lightbox-catalog --test fault_injection --release --
          kill9_leaves_catalog_clean_and_committed_txns_present
          --exact --nocapture

  # E01 Phase 8 (T28): the perf scenario harness. Publishes a per-OS table
  # to the job summary; compares against the committed dev-machine baselines
  # + the absolute §6/§7 budgets (page-query p95 < 100 ms @100 k, nav-swap
  # p95 < 50 ms). Non-blocking: regressions file/refresh a tracked issue.
  perf:
    name: perf scenarios (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Install Mesa software Vulkan adapter (lavapipe)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
          echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json" >> "$GITHUB_ENV"
          echo "VK_LOADER_DEBUG=error" >> "$GITHUB_ENV"

      - name: Cache fixture corpus
        uses: actions/cache@v4
        with:
          path: fixtures
          key: fixtures-${{ hashFiles('fixtures/manifest.toml') }}

      - name: Fetch + verify pinned fixtures
        run: cargo xtask fixtures

      - name: Run scenario harness (import-1k, page-query @100k, nav-swap)
        shell: bash
        run: |
          cargo run --release -p lbx-perf -- \
            --out perf-results-${{ matrix.os }}.json \
            --baseline tools/lbx-perf/baselines.json | tee perf-table.md
          cat perf-table.md >> "$GITHUB_STEP_SUMMARY"

      # E02 Phase H (H3): + the color/decode pipeline benches (resolve transform,
      # eval_cpu, display bake, probe, linearize) against the §7.5 budgets.
      - name: Criterion micro-benches (catalog + E02 decode/color pipeline)
        run: cargo bench -p lightbox-catalog -p lightbox-decode -p lightbox-color

      - name: Upload perf artifacts
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ matrix.os }}
          path: |
            perf-results-${{ matrix.os }}.json
            perf-table.md
            target/criterion/**/estimates.json
          if-no-files-found: warn

      # Regression ⇒ tracked issue, non-blocking (spec §8). One issue per
      # OS+day; duplicates are acceptable noise until E16 tooling.
      - name: File tracked issue on regression
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q '^REGRESSION' perf-table.md; then
            gh issue create \
              --title "nightly perf regression: ${{ matrix.os }} $(date -u +%F)" \
              --label performance \
              --body-file perf-table.md || true
          fi

  # E01 Phase 8 (T28): scripted grid-scroll frame-time capture through the
  # real shell (T25's p95 < 16 ms number, formally recorded). Windowed app
  # on hosted runners — observational (continue-on-error) like the CI shell
  # smoke until seen green across the fleet; the dev-machine numbers live
  # in tools/lbx-perf/baselines.json.
  grid-scroll:
    name: grid-scroll capture (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Capture (Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 mesa-vulkan-drivers libvulkan1
          xvfb-run -a cargo run --release -p lightbox-shell --bin lightbox -- --perf-scroll 600 \
            | tee grid-scroll.json
      - name: Capture
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cargo run --release -p lightbox-shell --bin lightbox -- --perf-scroll 600 \
            | tee grid-scroll.json

      - name: Publish to summary
        shell: bash
        run: |
          {
            echo '### Grid-scroll frame times (${{ matrix.os }})'
            echo '```json'
            grep '"scenario":"grid-scroll"' grid-scroll.json || echo '(no capture)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # E02 Phase H (H4): AddressSanitizer + LeakSanitizer over the decode + FFI
  # surfaces — the in-crate permissive walkers, the LCMS2 wrapper
  # (lightbox-color), and the proxy client (and the libheif path when the `heic`
  # feature is enabled). Runs the full corpus + adversarial fixtures under ASan;
  # LSan is on via ASAN_OPTIONS. Needs a nightly toolchain + `-Zbuild-std` so the
  # std allocator is instrumented too. Non-blocking (nightly); a real UB/leak
  # fails the job. NOTE: this recipe is committed but UNVERIFIED on the E02 build
  # machine (macOS, no nightly ASan runner) — see E02-deviations.md (H4).
  # E05 Phase F (F1/F4, DoD #4/#9): the reference-hardware perf gate and the
  # extended fuzz/soak legs the E05 spec names as nightly-by-design (§8: "10k
  # soak" / "24 h fuzz" are not PR-gate steps). Runs on the hosted 3-OS
  # matrix, NOT the self-hosted RTX-3060/M-series reference runner the spec
  # names (§7) — that runner does not exist yet (recorded in
  # `docs/plan/epics/E05-deviations.md`, F1). Until it is provisioned this
  # job's p95 numbers are indicative time-series data, not the gate of
  # record; regressions are reported (job summary), never blocking, matching
  # the perf job's convention above.
  e05-extended:
    name: E05 extended fuzz/soak/perf (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Install Mesa software Vulkan adapter (lavapipe)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
          echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json" >> "$GITHUB_ENV"
          echo "VK_LOADER_DEBUG=error" >> "$GITHUB_ENV"

      # F4: a much larger bounded proptest case count than the PR-blocking
      # default (2000) — a practical stand-in for the spec's 24 h continuous
      # fuzz run, NOT equivalent to real coverage-guided fuzzing (cargo-fuzz
      # is not set up here; see fuzz_compile.rs module docs).
      - name: Extended compiler fuzz (F4)
        env:
          PROPTEST_CASES: "200000"
        run: cargo test -p lightbox-render --release --test fuzz_compile

      # F4: the same bounded concurrency stress test, repeated many times to
      # widen the window for a scheduling-order-dependent race the single
      # in-gate run might miss.
      - name: Repeated concurrency stress (F4)
        shell: bash
        run: |
          for i in $(seq 1 50); do
            cargo test -p lightbox-render --release --test concurrency_stress -- --exact \
              concurrent_submit_poll_cancel_never_corrupts_the_ticket_store_or_cache
          done

      # C10: the full 10k-iteration soak (the in-gate PR run uses a reduced
      # count — see E05-deviations.md).
      - name: Full 10k-iteration interactive soak (C10)
        run: cargo test -p lightbox-render-testkit --release --test soak -- --ignored --nocapture

      # F1: local (non-reference-hardware) slider-latency indicative numbers,
      # release build, published to the job summary — never asserted against
      # the <100 ms budget here (that gate needs the §7 reference runner).
      - name: Slider-latency scenario (F1, indicative only)
        shell: bash
        run: |
          cargo test -p lightbox-render-testkit --release f1_slider_latency -- --nocapture \
            2>&1 | tee f1-latency.log
          {
            echo '### F1 slider-latency (${{ matrix.os }}, NOT the reference-runner gate of record)'
            echo '```'
            grep '\[F1\]' f1-latency.log || echo '(no sample captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  sanitizers:
    name: ASan/LSan (decode + FFI surfaces)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: "-Zsanitizer=address"
      RUSTDOCFLAGS: "-Zsanitizer=address"
      # LSan is bundled into ASan on Linux; keep leak detection explicit.
      ASAN_OPTIONS: "detect_leaks=1:detect_stack_use_after_return=1"
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly with rust-src (build-std)
        run: |
          rustup toolchain install nightly --component rust-src --profile minimal
          rustup default nightly

      - uses: Swatinem/rust-cache@v2

      - name: Cache fixture corpus
        uses: actions/cache@v4
        with:
          path: fixtures
          key: fixtures-${{ hashFiles('fixtures/manifest.toml') }}

      - name: Fetch + verify pinned fixtures
        run: cargo run -p xtask -- fixtures

      # Instrument std too (-Zbuild-std) so allocations across the FFI boundary
      # are tracked. lightbox-decode owns the raw/DCP/ICC parse surfaces and the
      # proxy client; lightbox-color owns the LCMS2 wrapper.
      - name: ASan/LSan over decode + color
        run: >
          cargo +nightly test -Zbuild-std
          --target x86_64-unknown-linux-gnu
          -p lightbox-decode -p lightbox-color
