# SPDX-FileCopyrightText: 2026 PixeLabs
# SPDX-License-Identifier: AGPL-3.0-or-later
# Additional terms under AGPL section 7 apply: see COPYING.additional-terms.
#
# REUSE (https://reuse.software) metadata for files that cannot carry their own
# SPDX headers (or where headers would be noise). Everything else carries an
# explicit header; `reuse lint` is a CI gate (E01 spec §5 T3).

version = 1

[[annotations]]
path = [
  "README.md",
  "DEVELOPMENT.md",
  "LICENSE",
  "NOTICE",
  "COPYING.additional-terms",
  "CONTRIBUTING.md",
  "ARCHITECTURE.md",
  "SECURITY.md",
  "CODE_OF_CONDUCT.md",
  "CLA.md",
  ".gitignore",
  "Cargo.lock",
  "docs/**",
  "web/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 PixeLabs"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The fixture corpus is CC0 by policy: raws are CC0 uploads from
# raw.pixls.us, everything else is generated (see fixtures/manifest.toml for
# per-file provenance, URL, upstream checksum, license). The blobs are never
# committed (gitignored); this annotation covers local checkouts and CI caches.
[[annotations]]
path = ["fixtures/**", "tools/xtask/assets/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "raw.pixls.us contributors (CC0) and PixeLabs"
SPDX-License-Identifier = "CC0-1.0"

# Committed golden images (E01 T22): PNGs rendered from synthetic sources
# generated by our own test code, project-licensed, no third-party content.
[[annotations]]
path = ["crates/*/goldens/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 PixeLabs"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Committed perf baselines (E01 T28): JSON cannot carry comments/headers.
[[annotations]]
path = ["tools/lbx-perf/baselines.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 PixeLabs"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# UI typeface (dark-theme overhaul, spec §9): Inter, SIL OFL 1.1. Static
# hinted desktop TTFs (Regular/Medium/SemiBold) from the upstream rsms/inter
# v4.1 release (`extras/ttf/`), embedded via `include_bytes!` in
# `theme/fonts.rs`. Binary files can't carry SPDX headers, hence this
# annotation; license text lives in `LICENSES/OFL-1.1.txt`.
[[annotations]]
path = ["crates/lightbox-shell/assets/fonts/Inter-*.ttf"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2016 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

# Monospace typeface for tabular numeric readouts (slider values, EXIF,
# histogram numbers, spec §9): JetBrains Mono, SIL OFL 1.1. Static TTF from
# the upstream JetBrains/JetBrainsMono v2.304 release (`fonts/ttf/`).
[[annotations]]
path = ["crates/lightbox-shell/assets/fonts/JetBrainsMono-*.ttf"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors (https://github.com/JetBrains/JetBrainsMono)"
SPDX-License-Identifier = "OFL-1.1"

# The website's self-hosted webfonts. Inter and JetBrains Mono are subsets of
# the same TTFs the shell embeds; Inter Tight is the Google Fonts Latin subset
# of the variable face. All three are SIL OFL 1.1 and stay under it: an OFL
# font is aggregated with this program, never relicensed by it.
[[annotations]]
path = ["web/assets/fonts/Inter-*.woff2"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2016 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["web/assets/fonts/InterTight-*.woff2"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2016 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["web/assets/fonts/JetBrainsMono-*.woff2"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors (https://github.com/JetBrains/JetBrainsMono)"
SPDX-License-Identifier = "OFL-1.1"

# Site imagery: photographs rendered by the Lightbox engine from the CC0
# raw.pixls.us fixture corpus, and screenshots of the application itself.
[[annotations]]
path = ["web/assets/img/**", "web/assets/favicon.svg"]
precedence = "aggregate"
SPDX-FileCopyrightText = "raw.pixls.us contributors (CC0) and PixeLabs"
SPDX-License-Identifier = "CC0-1.0"

# XMP is XML and could carry a comment, but a preset file is data the app reads
# and writes, and a header inside one is noise that the writer would have to
# reproduce. Annotate instead. All of these are authored by this project: the
# Lightroom-shaped test fixtures are hand-written to exercise the `crs:` mapping
# and carry no Adobe data (each one says so in its own `x:xmptk` attribute).
[[annotations]]
path = [
  "assets/presets/**",
  "assets/color/looks/**",
  "crates/lightbox-edit/assets/retired-starter-presets/**",
  "crates/lightbox-edit/tests/fixtures/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 PixeLabs"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Process-version manifests are generated JSON (see the kernel-salt discipline
# in crates/lightbox-render/src/ng/compile/manifest.rs); JSON has no comments.
[[annotations]]
path = ["crates/lightbox-render/pv-manifests/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 PixeLabs"
SPDX-License-Identifier = "AGPL-3.0-or-later"
