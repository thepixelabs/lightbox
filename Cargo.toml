[workspace]
resolver = "2"
members = ["crates/*", "tools/*"]
# The cargo-fuzz seed target (spec §5 T19: fuzzing non-gating at M0) builds
# only under `cargo fuzz` (nightly, libFuzzer); keep it out of the PR-gate graph.
exclude = ["crates/lightbox-decode/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Intra-workspace crates
lightbox-types = { path = "crates/lightbox-types" }
lightbox-catalog = { path = "crates/lightbox-catalog" }
lightbox-core = { path = "crates/lightbox-core" }
lightbox-jobs = { path = "crates/lightbox-jobs" }
lightbox-decode = { path = "crates/lightbox-decode" }
lightbox-color = { path = "crates/lightbox-color" }
lightbox-preview = { path = "crates/lightbox-preview" }
lightbox-render = { path = "crates/lightbox-render" }
lightbox-render-testkit = { path = "crates/lightbox-render-testkit" }
lightbox-edit = { path = "crates/lightbox-edit" }
lightbox-ingest = { path = "crates/lightbox-ingest" }
lbx-image-compare = { path = "tools/lbx-image-compare" }

# Third-party (shared versions; adapt here, not per-crate)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# wgpu is pinned to the major that current egui-wgpu/eframe (0.35) links against:
# the zero-copy seam (spec §2.3 seam 2) requires the shell and the engine to
# share ONE wgpu::Device, which means one wgpu crate version workspace-wide.
wgpu = "29"
eframe = { version = "0.35", default-features = false, features = [
  "wgpu",
  "default_fonts",
  "wayland",
  "x11",
] }
ciborium = "0.2"
tokio = { version = "1", default-features = false }
pollster = "0.4"
toml = "1"
# The SQLite amalgamation is bundled (spec §4.2: no system dependency; public
# domain); `backup` exposes the online-backup API used by verified backups.
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
zstd = "0.13"
time = { version = "0.3", features = ["std", "formatting", "parsing", "macros"] }
walkdir = "2"
unicode-normalization = "0.1"
twox-hash = { version = "2", default-features = false, features = [
  "xxhash3_128",
  "xxhash3_64",
  "std",
] }
sha2 = "0.11"
# Probe + embedded-preview pipeline (spec §3.6/§3.7). NOTE: the spec names
# rawler for raw metadata, but rawler is LGPL-2.1 — denied in the crate graph
# by deny.toml/architecture §1.6 — so raw containers are probed by
# lightbox-decode's own permissive walkers instead (E01-deviations.md, Phase 5).
kamadak-exif = "0.6"
zune-jpeg = "0.5"
# Non-raw codecs for E02 Phase A decode (all permissive: MIT/Apache-2.0).
# `tiff` covers 8/16-bit TIFF sources (float-TIFF is 8/16-bit-scoped at M1 per
# E02 Open Question 6). `png` (below) is the image-rs PNG codec.
tiff = "0.11"
# E02 Phase D color-management engine: the `lcms2` crate vendors Little-CMS2
# and builds it STATIC (MIT). The GPL-3 `fast_float` plugin feature is NEVER
# enabled (E02 §Risks R2, D1 assert). Declared at the workspace level so
# Phase D fills bodies without touching the manifest.
lcms2 = "6"
# libc: POSIX rlimit/shm plumbing for the out-of-process LibRaw proxy
# (E02 Phase C). Declared now so Phase C fills the sandbox without editing
# the manifest.
libc = "0.2"
fast_image_resize = "6"
# Golden-image harness (spec §5 T22): committed goldens + failure heatmaps
# are PNGs; `png` is the image-rs codec (MIT/Apache-2.0).
png = "0.18"
# CPU node evaluation (spec §3.4/§5 T24 names rayon for the CPU path).
rayon = "1"
# E05 render node-graph engine (spec §2 module map + §3 interfaces). All
# MIT/Apache/CC0/Zlib — cargo-deny surface-1 clean; no native/FFI, so surfaces
# 2–3 are untouched by E05.
#   blake3   — content-keyed cache key + ParamHash + kernel salt (§3.5).
#   half     — f16 host-side working-tile pixels (RGBA16F, §4.2).
#   wide     — SIMD lanes for the CPU tile executor (superset; §4.4 parity path).
#   petgraph — the render DAG (RenderGraph, §1.3/§2.2 — architecturally DECIDED).
blake3 = "1"
half = "2"
wide = "0.7"
petgraph = "0.6"
proptest = "1"
tempfile = "3"
fastrand = "2"
criterion = { version = "0.8", default-features = false, features = [
  "cargo_bench_support",
] }

# Shared lints: `cargo clippy --workspace --all-targets -- -D warnings` is the CI gate.
# `unsafe_code` is denied workspace-wide; only lightbox-render (GPU interop) and future
# FFI crates may locally `#![allow(unsafe_code)]` with justification (E01 spec §5 T1).
[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"

# Golden-image and fault-injection tests are IO/CPU heavy; keep dev-deps optimized enough.
[profile.dev.package."*"]
opt-level = 1
