[package]
name = "lightbox-core"
description = "Headless core façade: Core/Session lifecycle, command bus, events, queries, observability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lightbox-catalog.workspace = true
lightbox-ingest.workspace = true
lightbox-jobs.workspace = true
lightbox-preview.workspace = true
lightbox-render.workspace = true
lightbox-types.workspace = true
thiserror.workspace = true
# `sync` for the §3.8 event broadcast (tokio broadcast::Receiver is part of
# the frozen Session surface); `rt` for the command dispatcher task.
tokio = { workspace = true, features = ["rt", "sync"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
fastrand.workspace = true
# Recipe::identity for driving Engine::submit end-to-end (spec §3.9).
lightbox-edit.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
zstd.workspace = true

[lints]
workspace = true
