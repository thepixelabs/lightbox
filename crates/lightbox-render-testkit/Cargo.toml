[package]
name = "lightbox-render-testkit"
description = "E05 render golden/parity/scenario harness + probe nodes (dev/test only — NOT shipped)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The engine under test (probe nodes implement `lightbox_render::ng::RenderNode`).
lightbox-render.workspace = true
lightbox-types.workspace = true
lightbox-jobs.workspace = true
# Recipe::identity for the F1 slider-latency harness (drives Engine::submit
# through the same RenderRequest shape the scheduler/session façade use).
lightbox-edit.workspace = true
# f16 working-tile pixels; content hashing for recipe/manifest keys.
half.workspace = true
blake3.workspace = true
# Committed goldens + failure heatmaps are PNGs.
png.workspace = true
# Corpus manifest (de)serialization.
serde.workspace = true
serde_json.workspace = true
# The F1 harness's `DeviceProvider` impl names `wgpu::Device`/`Queue` directly.
wgpu.workspace = true

[lints]
workspace = true
