[package]
name = "lightbox-edit"
description = "Edit-recipe placeholder: only { schema, pv } + Recipe::identity() are frozen by E01; E09 owns the real recipe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lightbox-types.workspace = true
# `Recipe::default_for(pv, &AssetProbe)` is a frozen §3.2 seam signature; AssetProbe
# is owned by lightbox-decode. See E09-deviations.md A-2 for the transitive-weight note.
lightbox-decode.workspace = true
# The `crs:`/`lb:` mapping layer (spec §3.6, Phase D) targets the `XmpDoc`
# substrate in lightbox-meta. See E09-deviations.md D-1 (Phase D shipped ahead of
# Phase C) and D-3 (render/shell gain lightbox-meta transitively, source untouched).
lightbox-meta.workspace = true
serde.workspace = true
# CBOR is the authoritative recipe serialization (spec §3.2 / T3). Deterministic
# hand-built encode over ciborium::value::Value (deviations A-3).
ciborium.workspace = true
# xxh3-128 canonical_hash — big-endian per the E01 pin convention (T4).
twox-hash.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
# `CrsImportReport` is a serde `Serialize` seam (spec §3.6); the Phase D tests
# assert it serializes for the E08/E16 fidelity-surfacing consumers.
serde_json.workspace = true

[lints]
workspace = true
