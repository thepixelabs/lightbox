#
# Committed probe expectations for the pinned fixture corpus (E01 spec §5
# T19 AC). One entry per fixture in fixtures/manifest.toml; values verified
# against an independent (python) container walk at authoring time and
# sanity-checked against the cameras' published specs. The fixtures are
# hash-pinned, so these values can only change if probe() changes — which is
# exactly what this file is here to catch.
#
# Notes:
# - `width`/`height` are the probe's full-size dims: EXIF PixelX/YDimension
#   when present (authoritative under crop modes), else the largest non-preview
#   IFD (sensor-area dims, e.g. the E-1's 2624x1966), else the largest
#   embedded preview's SOF dims (the RAF path).
# - `embedded` is sorted largest-first; byte ranges are absolute in the file.
# - The corrupt corpus asserts `error = "malformed"` — an Err, never a panic.

[[fixture]]
name = "canon-eos-350d.cr2"
format = "CR2"
width = 3456
height = 2304
orientation = 1
make = "Canon"
model = "Canon EOS 350D DIGITAL"
capture_time = "2008-05-23T14:51:02"
embedded = [
  { width = 3456, height = 2304, start = 9728, end = 3352208 },
  { width = 160, height = 120, start = 3352720, end = 3360210 },
]

