#
# Surface-3 data-provenance manifest (E02 §4.3). Every file bundled under
# assets/ is declared here with its provenance and license. The policy checker
# (crates/lightbox-color/tests/look_assets.rs::manifest_policy_checker_*, and
# E16's release-runner hardening) is PR-blocking and fails the build on:
#   * any file under assets/color/ with no entry;
#   * any provenance outside {lightbox-authored, profgen:<session>, community:<pack>};
#   * ANY entry whose provenance / license / copyright indicates Adobe authorship.
#
# E02 establishes the color-asset entries. Ship ZERO bundled camera profiles:
# assets/color/profiles/ is intentionally empty (tier-1 matrix base + tier-2
# look render every corpus body correctly without them, see E02 §0).

[[asset]]
path       = "color/looks/lightbox-color-v1.lblook"
kind       = "look"
provenance = "lightbox-authored"          # self-review: color/looks/lightbox-color-v1.review.toml
license    = "project"
bundled    = true

[[asset]]
path       = "color/looks/lightbox-neutral.lblook"
kind       = "look"
provenance = "lightbox-authored"
license    = "project"
bundled    = true

[[asset]]
path       = "color/looks/scene-corpus.toml"
kind       = "scene-corpus"
provenance = "lightbox-authored"          # synthetic (project-generated) authoring corpus, not shipped
license    = "project"
bundled    = false

[[asset]]
path       = "color/looks/lightbox-color-v1.review.toml"
kind       = "review-record"
provenance = "lightbox-authored"
license    = "project"
bundled    = false

